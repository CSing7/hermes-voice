name: Build hermes-voice image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native ARM64 runner (free for public repos) - matches the Oracle server.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Work out image names
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          hermes_tag="$(sed -n 's/^ARG HERMES_TAG=//p' Dockerfile)"
          image="ghcr.io/${owner}/hermes-voice"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "hermes_tag=${hermes_tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Base Hermes release: ${hermes_tag}"

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: hermes-voice:test

      - name: Smoke test - voice packages, Opus, Hermes import
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/python \
            -w /opt/hermes hermes-voice:test -c '
          import ctypes.util
          import discord, davey, nacl, faster_whisper, edge_tts, sounddevice, ctranslate2, onnxruntime
          discord.opus.load_opus(ctypes.util.find_library("opus"))
          assert discord.opus.is_loaded(), "Opus failed to load"
          from tools.transcription_tools import transcribe_audio, transcribe_audio_local_fallback
          print("discord", discord.__version__, "| nacl", nacl.__version__)
          print("OK: voice packages, Opus and Hermes all load")
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          img="${{ steps.meta.outputs.image }}"
          for t in "${{ steps.meta.outputs.hermes_tag }}" "sha-${{ steps.meta.outputs.short_sha }}"; do
            docker tag hermes-voice:test "${img}:${t}"
            if ! out="$(docker push "${img}:${t}" 2>&1)"; then
              echo "$out"
              echo "::error title=Push failed::$(echo "$out" | tail -3 | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "### Use this in Coolify" >> "$GITHUB_STEP_SUMMARY"
          echo "\`image: ${img}:${{ steps.meta.outputs.hermes_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
